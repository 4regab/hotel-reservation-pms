asyncapi: 2.6.0
info:
  title: HarborLight Hotels - Reservation Confirmation Event
  version: 1.0.0
  description: |
    Booking saves the confirmation and its event in ONE local transaction (transactional outbox).
    A scheduled dispatcher delivers the event over authenticated HTTPS (POST /internal/events).
    Consumers write the eventId to their inbox in the same transaction as their own update, so
    a retry is applied once. A 2xx answer means "committed". Guest contact details are never in events.
defaultContentType: application/json
servers:
  booking:
    url: http://booking:8000
    protocol: http
    description: Private network. Callers send a scoped bearer credential and X-Service-Caller.
channels:
  hotel.reservations.v1:
    description: Logical outbox channel. Delivered to POST /internal/events of each consumer.
    subscribe:
      operationId: onReservationConfirmed
      summary: Booking publishes. Room Operations (arrivals) and the portal (email, reporting) consume.
      message:
        $ref: '#/components/messages/ReservationConfirmed'
components:
  messages:
    ReservationConfirmed:
      name: ReservationConfirmed
      title: Reservation confirmed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReservationConfirmedEnvelope'
      examples:
        - name: two nights, one Standard room
          payload:
            eventId: 6f1c0b7e-2d0a-4a53-9d0e-6a7a5f0c2b11
            schemaVersion: 1
            eventType: ReservationConfirmed
            occurredAt: '2026-12-01T02:15:00Z'
            aggregateId: 0b6d2f0e-7d3a-4c19-8f6e-3d2e1a9c7b55
            aggregateVersion: 2
            correlationId: 0b6d2f0e-7d3a-4c19-8f6e-3d2e1a9c7b55
            data:
              reservationId: 0b6d2f0e-7d3a-4c19-8f6e-3d2e1a9c7b55
              roomTypeId: 11111111-1111-4111-8111-111111111111
              checkIn: '2026-12-10'
              checkOut: '2026-12-12'
              quantity: 1
              amountMinor: 500000
              currency: PHP
  schemas:
    ReservationConfirmedEnvelope:
      type: object
      required: [eventId, schemaVersion, eventType, occurredAt, aggregateId, aggregateVersion, correlationId, data]
      properties:
        eventId: { type: string, format: uuid, description: Reused on every retry. }
        schemaVersion: { type: integer, const: 1 }
        eventType: { type: string, const: ReservationConfirmed }
        occurredAt: { type: string, format: date-time, description: UTC. }
        aggregateId: { type: string, format: uuid, description: The reservation id. }
        aggregateVersion: { type: integer, minimum: 1, description: Increases with every change to the reservation. }
        correlationId: { type: string, format: uuid }
        data:
          type: object
          required: [reservationId, roomTypeId, checkIn, checkOut, quantity, amountMinor, currency]
          properties:
            reservationId: { type: string, format: uuid }
            roomTypeId: { type: string, format: uuid }
            checkIn: { type: string, format: date, description: Asia/Manila date. }
            checkOut: { type: string, format: date, description: Asia/Manila date. }
            quantity: { type: integer, minimum: 1, maximum: 5 }
            amountMinor: { type: integer, description: Centavos. }
            currency: { type: string, const: PHP }
