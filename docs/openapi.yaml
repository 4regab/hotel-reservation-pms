        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/folios/{id}/charges:
    post:
      operationId: postFoliosIdCharges
      tags: [Finance]
      summary: "Add a charge to an open bill"
      description: "Who: cashier, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/guests:
    get:
      operationId: getGuests
      tags: [Booking]
      summary: "Search guests (q)"
      description: "Who: reception, manager, steward."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: postGuests
      tags: [Booking]
      summary: "Create a guest without an account (walk-in). Reuses a guest with the same email"
      description: "Who: reception, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/guests/duplicates:
    get:
      operationId: getGuestsDuplicates
      tags: [Booking]
      summary: "Groups of possible duplicate guests (same email, phone digits or name words). Counts only, no booking details"
      description: "Who: steward."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
