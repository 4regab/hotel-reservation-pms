      summary: "Change a room status by hand (DIRTY to CLEANING, out of service, back in service). READY is reached only by inspection. Rejects stale versions"
      description: "Who: housekeeping, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/stays/check-in:
    post:
      operationId: postStaysCheckIn
      tags: [Front desk]
      summary: "Check a guest in: confirmed booking, identity verified, a ready room of the booked type, payment or guarantee, and the arrival date (earlier needs a manager override)"
      description: "Who: reception, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/stays/check-out:
    post:
      operationId: postStaysCheckOut
      tags: [Front desk]
      summary: "Check a guest out: the balance must be settled; the room becomes DIRTY and a cleaning task is created"
      description: "Who: reception, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/webhooks/paymongo:
    post:
      operationId: postWebhooksPaymongo
      tags: [Finance]
      summary: "Payment provider callback. The signature of the raw body is checked; replays and late payments are handled safely"
      description: "Who: the payment provider (signature checked)."
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Acknowledged after the payment is saved. result is captured, duplicate, review or ignored }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: HLSESSID
      description: Secure, HttpOnly, SameSite session cookie from POST /v1/login.
  responses:
    Error:
      description: "Error. 401 not signed in, 403 role or CSRF refused, 404 not found or not yours, 409 conflict or illegal state, 422 invalid input, 429 too many requests, 503 a service is unavailable."
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVENTORY_CONFLICT }
            message: { type: string }
            details: { type: object }
    AvailabilityResult:
      type: object
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        quantity: { type: integer }
        adults: { type: integer }
        options:
          type: array
          items:
            type: object
            properties:
              roomTypeId: { type: string, format: uuid }
              name: { type: string, example: Standard }
              slug: { type: string, example: standard }
              available: { type: integer }
              fits: { type: boolean, description: Whether the guests fit in the requested rooms. }
              nightlyMinor: { type: integer, example: 380000 }
              totalMinor: { type: integer, example: 760000 }
              currency: { type: string, example: PHP }
              maxGuests: { type: integer }
              amenities: { type: array, items: { type: string } }
              quoteId: { type: string, nullable: true, description: Signed quote, valid 15 minutes. }
    CreateReservationRequest:
      type: object
      required: [quoteId, roomTypeId, checkIn, checkOut, quantity]
      description: roomTypeId, checkIn, checkOut and quantity must equal what the quote was issued for. Guests book for themselves (their account supplies the contact details).
      properties:
        quoteId: { type: string }
        roomTypeId: { type: string, format: uuid }
        checkIn: { type: string, format: date, example: '2026-12-01' }
        checkOut: { type: string, format: date, example: '2026-12-03' }
        quantity: { type: integer, minimum: 1, maximum: 5 }
        adults: { type: integer, minimum: 1 }
        specialRequests: { type: string, maxLength: 300 }
        onBehalfOfGuestId: { type: string, format: uuid, description: Reception only (walk-in). }
    ReservationHold:
      type: object
      required: [reservationId, status, holdExpiresAt, amountMinor, currency]
      properties:
        reservationId: { type: string, format: uuid }
        code: { type: string, example: HL7K3Q9X }
        status: { type: string, enum: [HELD] }
        holdExpiresAt: { type: string, format: date-time, description: UTC. }
        amountMinor: { type: integer, example: 760000 }
        currency: { type: string, enum: [PHP] }
        roomTypeId: { type: string, format: uuid }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        quantity: { type: integer }
