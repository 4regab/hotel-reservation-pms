      summary: "Rooms set aside for partners and how much is used"
      description: "Who: reception, manager."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: postOtaAllotments
