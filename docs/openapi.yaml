openapi: 3.0.3
info:
  title: MA Hotel - Portal API
  version: 2.0.0
  description: |
    The public JSON API of the portal. The website uses the same services; this API is for integrations and tests.
    GENERATED by scripts/gen-openapi.php from the code (routes and roles). Do not edit by hand.

    - Money is integer centavos (PHP 2,500.00 = 250000), currency PHP. Stay dates are Asia/Manila calendar dates (YYYY-MM-DD). Times are UTC.
    - A hold reserves every night from check-in up to, but excluding, check-out, or none of them, for 10 minutes. A booking is confirmed only
      after a verified payment or a manager-approved pay-at-hotel guarantee. A browser "success" page never confirms a booking.
    - Writes need the session cookie and an X-CSRF-Token header. Creating a hold and starting a payment also need an Idempotency-Key.
    - Staff sign in with a second factor. Every role is limited to the actions listed under each operation. Guests only reach their own records (others return 404).
    - Errors always look like {"error":{"code":"...","message":"..."}}.
servers:
  - url: http://localhost:8080
tags:
  - { name: Booking, description: Search, holds, cancellation, guests, room types }
  - { name: Front desk, description: Check-in and out, rooms, arrivals, no-shows }
  - { name: Housekeeping, description: Cleaning, inspection, maintenance }
  - { name: Finance, description: Payments, refunds, exports, bills }
  - { name: Channel, description: Travel partner allotments and CSV import }
  - { name: Reports, description: Occupancy, revenue, operations }
  - { name: Account, description: Sign-in, registration, password reset }
paths:
  /v1/arrival-overrides:
    post:
      operationId: postArrivalOverrides
      tags: [Front desk]
      summary: "Reception asks for check-in before the arrival date"
      description: "Who: reception, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      operationId: getArrivalOverrides
      tags: [Front desk]
      summary: "Early-arrival requests waiting for the manager"
      description: "Who: manager."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/arrival-overrides/{id}/approve:
    post:
      operationId: postArrivalOverridesIdApprove
      tags: [Front desk]
      summary: "Manager approves an early arrival ({id} is the reservation id)"
      description: "Who: manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/arrival-overrides/{id}/reject:
    post:
      operationId: postArrivalOverridesIdReject
      tags: [Front desk]
      summary: "Manager declines an early arrival"
      description: "Who: manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/arrivals:
    get:
      operationId: getArrivals
      tags: [Front desk]
      summary: "Expected arrivals (from confirmation events)"
      description: "Who: reception, manager."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/availability:
    get:
      operationId: getAvailability
      tags: [Booking]
      summary: "Search availability. Returns one option per room type with a signed price quote. Nothing is reserved"
      description: "Who: anyone (rate limited)."
      security: []
      parameters:
        - { name: checkIn, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkOut, in: query, required: true, schema: { type: string, format: date } }
        - { name: quantity, in: query, schema: { type: integer, minimum: 1, maximum: 5, default: 1 } }
        - { name: adults, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: One option per room type; quoteId is null when it is sold out or too small, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/cleaning-tasks:
    get:
      operationId: getCleaningTasks
      tags: [Housekeeping]
      summary: "Cleaning tasks, open by default"
      description: "Who: housekeeping, manager, reception."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/cleaning-tasks/{id}/clean:
    post:
      operationId: postCleaningTasksIdClean
      tags: [Housekeeping]
      summary: "The cleaner reports the room clean. It waits for inspection"
      description: "Who: housekeeping, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/cleaning-tasks/{id}/inspect:
    post:
      operationId: postCleaningTasksIdInspect
      tags: [Housekeeping]
      summary: "A second person inspects. Sets the room READY. Not allowed for the person who cleaned it, unless a manager"
      description: "Who: housekeeping, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/exports:
    get:
      operationId: getExports
      tags: [Finance]
      summary: "Accounting exports and their approval state"
      description: "Who: cashier, manager."
      security:
        - sessionCookie: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: postExports
      tags: [Finance]
      summary: "Prepare an accounting export for closed days (from, to). Needs approval before download"
      description: "Who: cashier, manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/exports/{id}/approve:
    post:
      operationId: postExportsIdApprove
      tags: [Finance]
      summary: "Approve an export. Never the person who requested it"
      description: "Who: manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/exports/{id}/download:
    get:
      operationId: getExportsIdDownload
