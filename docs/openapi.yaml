  /v1/login:
    post:
      operationId: postLogin
      tags: [Account]
      summary: "Sign in. Staff also send the 6-digit code in \"otp\". Starts the session and returns the CSRF token"
      description: "Who: anyone (rate limited, account locks after 5 failures)."
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
