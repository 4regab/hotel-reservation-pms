      summary: "Download an approved export as CSV (returned as JSON with filename, checksum and csv)"
      description: "Who: cashier, manager."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/exports/{id}/reject:
    post:
      operationId: postExportsIdReject
      tags: [Finance]
      summary: "Reject an export"
      description: "Who: manager. Needs X-CSRF-Token."
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/folios/{id}:
    get:
      operationId: getFoliosId
      tags: [Finance]
      summary: "The guest bill for a reservation: total, paid, refunded, balance"
      description: "Who: reception, cashier, manager, service."
      security:
