name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, logic checks, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlsrv
      - name: Lint every PHP file (php -l)
        run: bash scripts/lint.sh
      - name: Logic checks (no database, no network)
        run: php tests/run.php
      - name: Static analysis (PHPStan level 5, known older findings in the baseline)
        run: |
          curl -fsSL -o phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.3.5/phpstan.phar
          php -d memory_limit=1G phpstan.phar analyse --no-progress

  css:
    name: Compiled CSS is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:css
      - name: The committed CSS must match a fresh build
        run: git diff --exit-code portal/public/assets/app.css

  e2e:
    name: End-to-end, concurrency and payment tests on SQL Server 2025
    # Pinned: ubuntu-latest moved to 26.04, which has no Microsoft ODBC driver preinstalled.
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Ci-only-sa-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P Ci-only-sa-Passw0rd -C -b -Q 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30 --health-start-period=20s
    env:
      DB_ADMIN_PORT: '1433'
      DB_ADMIN_USER: sa
      DB_ADMIN_PASS: Ci-only-sa-Passw0rd
      RUN_DIR: ${{ github.workspace }}/.run
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft ODBC Driver 18 for SQL Server (pdo_sqlsrv needs it to connect)
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            # Add Microsoft's package list only if the runner does not already have it (two copies make apt fail).
            if ! grep -rqs "packages.microsoft.com/ubuntu/24.04/prod" /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 unixodbc
          fi
          odbcinst -q -d
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlsrv
      - name: Start the four services, run migrations and load demo data
        run: bash scripts/dev-stack.sh start
      - name: Full journey (search, hold, pay, confirm, email, check-in, check-out, cleaning, ready)
        run: bash -c 'source scripts/dev-env.sh && php tests/e2e/journey.php'
      - name: Business rules (approvals, no-show, OTA import, privacy, password reset, roles)
        run: bash -c 'source scripts/dev-env.sh && php tests/e2e/features.php'
      - name: 20 guests, one room (no overselling)
        run: bash -c 'source scripts/dev-env.sh && php tests/e2e/concurrency.php'
      - name: Webhook replay, wrong amount, late payment, payment after cancellation
        run: bash -c 'source scripts/dev-env.sh && php tests/e2e/payments.php'
      - name: Service logs (only on failure)
        if: failure()
        run: tail -n 80 .run/*.log

  docker:
    name: Docker Compose starts and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Build and start (waits until every healthcheck passes)
        run: docker compose up --build --wait --wait-timeout 240
      - name: The site answers
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "MA Hotel"
          curl -fsS http://127.0.0.1:8080/rooms | grep -q "Deluxe"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/internal/events)" = "404"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=60
