[www]
; Keep the container's environment: each service reads its own database and credentials from it.
clear_env = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
