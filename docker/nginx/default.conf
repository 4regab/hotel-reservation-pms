# One nginx, four virtual servers.
#   :8080  the public site (portal). The only port published to the outside.
#   :8001  booking   \
#   :8002  roomops    >  private. Reachable only from other containers on the compose network.
#   :8003  billing   /
#   :8004  portal's private event endpoint (the other services send events here; /internal/ is blocked on :8080)
# Behind a TLS terminator or load balancer, nginx trusts X-Forwarded-For from private address ranges so
# that rate limits count the real visitor, not the proxy.

real_ip_header X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

server_tokens off;
client_max_body_size 1m;
fastcgi_read_timeout 30s;

server {
    listen 8080;
    server_name _;
    root /app/portal/public;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { return 204; }
    location ^~ /internal/ { return 404; }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass portal:9000;
    }
}

server {
    listen 8001;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/booking/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass booking:9000;
    }
}

server {
    listen 8002;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/roomops/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass roomops:9000;
    }
}

server {
    listen 8003;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/billing/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass billing:9000;
    }
}

server {
    listen 8004;
    # The demo checkout (PAYMONGO_MODE=mock) posts its signed provider events here, like PayMongo posts to the public port.
    location = /v1/webhooks/paymongo {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass portal:9000;
    }
    location /internal/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/portal/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass portal:9000;
    }
    location / { return 404; }
}
