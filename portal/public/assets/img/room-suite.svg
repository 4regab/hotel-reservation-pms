<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustration of a Suite with a living room, sofa, dining table and a panoramic bay window at sunset">
  <rect width="800" height="520" fill="#1e293b"/>
  <!-- panoramic window -->
  <rect x="30" y="30" width="740" height="290" rx="10" fill="#f8fafc"/>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c4a6e"/><stop offset=".6" stop-color="#f59e0b"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>
  <rect x="44" y="44" width="712" height="262" fill="url(#dusk)"/>
  <rect x="44" y="214" width="712" height="92" fill="#0e7490"/>
  <circle cx="560" cy="212" r="40" fill="#fef3c7"/>
  <path d="M520 226h80M530 240h60M540 256h40" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <g fill="#075985" opacity=".9"><rect x="64" y="180" width="38" height="40"/><rect x="108" y="160" width="30" height="60"/><rect x="144" y="190" width="50" height="30"/></g>
  <g transform="translate(250 130)"><path d="M16 0l-14 14v14h28V14z" fill="#334155"/><path d="M6 30h20l7 74H-1z" fill="#f8fafc"/><rect x="6" y="48" width="20" height="10" fill="#0369a1"/></g>
  <path d="M400 44v262M222 44v262M578 44v262" stroke="#f8fafc" stroke-width="7"/>
  <path d="M14 22h772v16H14z" fill="#475569"/>
  <path d="M20 38h64v290H20zM716 38h64v290h-64z" fill="#fde68a" opacity=".9"/>
  <!-- floor -->
  <rect y="330" width="800" height="190" fill="#475569"/>
  <rect y="322" width="800" height="10" fill="#64748b"/>
  <ellipse cx="400" cy="440" rx="330" ry="52" fill="#0c4a6e" opacity=".6"/>
  <!-- sofa -->
  <g transform="translate(70 300)">
    <rect x="0" y="20" width="260" height="90" rx="20" fill="#0e7490"/>
    <rect x="10" y="0" width="240" height="60" rx="16" fill="#155e75"/>
    <rect x="-14" y="46" width="40" height="76" rx="14" fill="#164e63"/><rect x="234" y="46" width="40" height="76" rx="14" fill="#164e63"/>
    <rect x="20" y="52" width="100" height="50" rx="10" fill="#0891b2"/><rect x="140" y="52" width="100" height="50" rx="10" fill="#0891b2"/>
    <rect x="30" y="14" width="50" height="40" rx="10" fill="#fbbf24"/>
  </g>
  <!-- coffee table + lamp -->
  <rect x="150" y="430" width="120" height="14" rx="4" fill="#92400e"/><rect x="160" y="444" width="8" height="26" fill="#78350f"/><rect x="252" y="444" width="8" height="26" fill="#78350f"/>
  <rect x="400" y="330" width="6" height="110" fill="#94a3b8"/><path d="M403 300l-24 40h48z" fill="#fde68a"/>
  <!-- dining table -->
  <g transform="translate(470 360)">
    <rect x="0" y="0" width="240" height="14" rx="6" fill="#b45309"/><rect x="20" y="14" width="10" height="80" fill="#92400e"/><rect x="210" y="14" width="10" height="80" fill="#92400e"/>
    <rect x="20" y="-26" width="34" height="26" rx="8" fill="#e2e8f0"/><rect x="80" y="-26" width="34" height="26" rx="8" fill="#e2e8f0"/><rect x="146" y="-26" width="34" height="26" rx="8" fill="#e2e8f0"/><rect x="200" y="-26" width="34" height="26" rx="8" fill="#e2e8f0"/>
    <rect x="100" y="-14" width="40" height="14" rx="4" fill="#f8fafc"/><circle cx="120" cy="-24" r="10" fill="#34d399"/>
  </g>
</svg>
