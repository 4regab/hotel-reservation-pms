<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a harbor at dusk with a lighthouse and boats">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset=".55" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <g fill="#e0f2fe" opacity=".35">
    <ellipse cx="260" cy="130" rx="130" ry="18"/><ellipse cx="340" cy="150" rx="90" ry="12"/>
    <ellipse cx="1180" cy="90" rx="150" ry="16"/><ellipse cx="1260" cy="112" rx="100" ry="12"/>
  </g>
  <g fill="#fef3c7" opacity=".9">
    <circle cx="140" cy="60" r="2"/><circle cx="420" cy="40" r="1.5"/><circle cx="700" cy="85" r="2"/><circle cx="980" cy="45" r="1.5"/><circle cx="1420" cy="70" r="2"/><circle cx="1530" cy="150" r="1.5"/>
  </g>
  <circle cx="1060" cy="430" r="240" fill="url(#sun)"/>
  <circle cx="1060" cy="430" r="62" fill="#fef3c7"/>
  <!-- distant city -->
  <g fill="#075985" opacity=".85">
    <rect x="40" y="380" width="60" height="120"/><rect x="110" y="340" width="44" height="160"/><rect x="164" y="395" width="70" height="105"/>
    <rect x="250" y="360" width="50" height="140"/><rect x="310" y="400" width="80" height="100"/><rect x="400" y="330" width="40" height="170"/>
    <rect x="1280" y="370" width="56" height="130"/><rect x="1346" y="335" width="46" height="165"/><rect x="1402" y="390" width="80" height="110"/><rect x="1492" y="355" width="60" height="145"/>
  </g>
  <g fill="#fbbf24" opacity=".8">
    <rect x="122" y="360" width="6" height="8"/><rect x="136" y="380" width="6" height="8"/><rect x="262" y="380" width="6" height="8"/><rect x="410" y="350" width="6" height="8"/><rect x="1360" y="355" width="6" height="8"/><rect x="1510" y="378" width="6" height="8"/>
  </g>
  <!-- lighthouse -->
  <g transform="translate(930 110)">
    <path d="M60 0l-30 22v34h60V22z" fill="#1e293b"/>
    <rect x="34" y="38" width="52" height="12" fill="#fbbf24"/>
    <path d="M38 56h44l18 300H20z" fill="#f8fafc"/>
    <path d="M32 120h56l-3 34H35zM27 220h66l-3 34H30z" fill="#0369a1"/>
    <rect x="14" y="350" width="92" height="14" fill="#475569"/>
    <path d="M60 44L-120 10v70zM60 44l180-34v70z" fill="#fef3c7" opacity=".25"/>
  </g>
  <!-- sea -->
  <rect y="480" width="1600" height="220" fill="url(#sea)"/>
  <path d="M0 480h1600" stroke="#38bdf8" stroke-width="2" opacity=".5"/>
  <g stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M1010 500h100M1030 520h60M1000 545h120M1040 570h40"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity=".35" fill="none">
    <path d="M60 540q20-10 40 0t40 0 40 0M300 600q20-10 40 0t40 0 40 0M700 560q20-10 40 0t40 0 40 0M1300 620q20-10 40 0t40 0 40 0M520 650q20-10 40 0t40 0 40 0"/>
  </g>
  <!-- sailboat -->
  <g transform="translate(200 440)">
    <path d="M60 0v90L10 90z" fill="#f8fafc"/><path d="M68 18v72h44z" fill="#e0f2fe"/>
    <path d="M0 96h130l-20 22H20z" fill="#7c2d12"/>
  </g>
  <!-- ferry -->
  <g transform="translate(1180 470)">
    <path d="M0 40h190l-22 30H24z" fill="#1e293b"/>
    <rect x="30" y="14" width="120" height="26" fill="#f8fafc"/>
    <rect x="60" y="0" width="60" height="14" fill="#e2e8f0"/>
    <g fill="#0369a1"><rect x="40" y="22" width="14" height="10"/><rect x="62" y="22" width="14" height="10"/><rect x="84" y="22" width="14" height="10"/><rect x="106" y="22" width="14" height="10"/><rect x="128" y="22" width="14" height="10"/></g>
    <rect x="86" y="-14" width="10" height="14" fill="#b45309"/>
  </g>
  <!-- foreground pier -->
  <path d="M0 640h1600v60H0z" fill="#0f172a" opacity=".55"/>
  <g fill="#0f172a" opacity=".7"><rect x="120" y="610" width="14" height="90"/><rect x="420" y="610" width="14" height="90"/><rect x="720" y="610" width="14" height="90"/><rect x="1020" y="610" width="14" height="90"/><rect x="1320" y="610" width="14" height="90"/></g>
</svg>
